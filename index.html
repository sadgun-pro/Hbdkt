<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hey Karthik</title>
</head>
<body style="margin:0;background:#1a1214;color:#f5e6d8;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh">
<p id="s">Loading surprise...</p>
<script>
async function go(){
  const files=["t0.txt","t1.txt","t2.txt","t3.txt","t4.txt","t5.txt","t6.txt","t7.txt","t8.txt","t9.txt"];
  const parts=await Promise.all(files.map(f=>fetch(f+"?v=3").then(r=>r.text())));
  document.open();
  document.write(parts.join(""));
  document.close();
}
go().catch(e=>{document.getElementById("s").textContent="Error: "+e;});
</script>
</body>
</html>
