<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hey Karthik 🎂</title>
</head>
<body style="margin:0;background:#1a1214;color:#f5e6d8;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh">
<p id="s">Loading surprise…</p>
<script>
const b64 = "PLACEHOLDER_B64";
async function go() {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const text = await new Response(stream).text();
  document.open();
  document.write(text);
  document.close();
}
go().catch(e => { document.getElementById("s").textContent = "Please use a modern browser. " + e; });
</script>
</body>
</html>
